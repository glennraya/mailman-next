name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build the UI
        run: cd web && npm ci && npm run build

      # One job builds every platform: the SQLite driver is pure Go, so
      # nothing here needs a matching C toolchain.
      - name: Cross-compile
        run: make dist

      - name: Checksums
        run: cd build/dist && sha256sum mailman-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: build/dist/SHA256SUMS

  # Publishing the formula is a separate job so a failure here -- usually a
  # missing or expired tap token -- leaves the release itself intact.
  tap:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: checksums

      - name: Check out the tap
        uses: actions/checkout@v5
        with:
          repository: glennraya/homebrew-tap
          path: tap
          # The default GITHUB_TOKEN cannot push to another repository, so
          # this needs a fine-grained PAT scoped to the tap alone.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Render the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha() { grep " mailman-$1\$" SHA256SUMS | awk '{print $1}'; }

          mkdir -p tap/Formula
          sed \
            -e "s|__VERSION__|$version|g" \
            -e "s|__SHA_DARWIN_ARM64__|$(sha darwin-arm64)|" \
            -e "s|__SHA_DARWIN_AMD64__|$(sha darwin-amd64)|" \
            -e "s|__SHA_LINUX_ARM64__|$(sha linux-arm64)|" \
            -e "s|__SHA_LINUX_AMD64__|$(sha linux-amd64)|" \
            packaging/homebrew/mailman.rb.tmpl > tap/Formula/mailman.rb

          # A placeholder left in the output means a checksum was missing,
          # and a formula that cannot install is worse than no update.
          if grep -q '__' tap/Formula/mailman.rb; then
            echo "the formula still has unfilled placeholders:"
            grep -n '__' tap/Formula/mailman.rb
            exit 1
          fi

      - name: Push
        run: |
          cd tap
          if git diff --quiet -- Formula/mailman.rb; then
            echo "the formula is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mailman.rb
          git commit -m "mailman ${GITHUB_REF_NAME#v}"
          git push
